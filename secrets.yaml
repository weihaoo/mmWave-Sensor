# The display name used in Home Assistant (HA)
friendly_name: "LD2450"

# Your Wi-Fi SSID and password
wifi_ssid: "wifi_ssid"
wifi_password: "wifi_password"

# Password for the captive portal/access point
ap_password: "ap_password"

# Encryption key if you want sensor traffic sent to HA to be encrypted
api_encryption_key: "api_encryption_key"

# Password used for OTA Updates (Updating the ESP32 over wifi instead of USB)
ota_password: "change_me"

#  Thread network  (only needed if you uncomment the Thread block in LD2450.yaml)
thread_channel: 15                                       # int, 11-26
thread_network_name: "my-thread-network"                 # human-readable name
thread_network_key: "0x00112233445566778899aabbccddeeff" # 16-byte hex (the network/master key)
thread_pan_id: "0x1234"                                  # 2-byte hex
thread_ext_pan_id: "0x1111111122222222"                  # 8-byte hex
thread_pskc: "0xaabbccddeeff00112233445566778899"        # 16-byte hex
thread_mesh_local_prefix: "fd00:0db8:00a0:0000::/64"     # IPv6 /64 prefix